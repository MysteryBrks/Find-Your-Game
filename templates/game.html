{% extends "layout.html" %}

{% block main %}
    {% for game in games %}
        <div class="mb-3" id="{{ game.name }}">
            <iframe src="https://store.steampowered.com/widget/{{ game.appid }}/" frameborder="0" width="646" height="190"></iframe>
        </div>
    {% endfor %}
    <footer>
        <nav aria-label="Page navigation">
            <ul class="pagination">
                {% if page > 1 %}
                <li class="page-item"><a class="page-link" href="{{ url_for('game', page=page-1) }}">Previous</a></li>
                {% endif %}
                {% if page < total_pages %}
                <li class="page-item"><a class="page-link" href="{{ url_for('game', page=page+1) }}">Next</a></li>
                {% endif %}
            </ul>
        </nav>
    </footer>
{% endblock %}
