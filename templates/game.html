{% extends "layout.html" %}

{% block main %}
    {% for game in games %}
        <div class="mb-3" id="{{ game.name }}">
            <iframe src="https://store.steampowered.com/widget/{{ game }}/" title="{{ game }}" frameborder="0" width="646" height="190"></iframe>
            <a href="https://store.steampowered.com/app/{{ game }}" target="_blank">
                <img src="static/images/steam logo.png">
            </a>
        </div>
    {% endfor %}
{{ pagination.links }}
{% endblock %}
