<!-- index.html should greet user with input request of tags and
 other elements to find a list of games within the steamspyapi
 data base -->

{% extends "layout.html" %}
{% block main %}
    <h1>Find Your Game</h1>
    <form action="/" method="post">
        <div class="mb-3">
            <label for="genres-label">Genre</label>
            <select class="js-example-basic-multiple" multiple="multiple" name="genres">
                {% for genre in genres %}
                <option value="{{ genre }}">{{ genre }}</option>
                {% endfor %}
            </select>

            <label for="tags-label">Tags</label>
            <select class="js-example-basic-multiple" multiple="multiple" name="tags">
                {% for tag in tags %}
                <option value="{{ tag }}">{{ tag }}</option>
                {% endfor %}
            </select>

            <input class="btn btn-primary" type="submit" value="Submit">
        </div>
    </form>
{% endblock %}
