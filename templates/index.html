<!-- index.html should greet user with input request of tags and
 other elements to find a list of games within the steamspyapi
 data base -->

{% extends "layout.html" %}
{% block main %}
    <h1 class="mb-5">Find Your Game</h1>
    <form action="/" method="post">
        <div class="mb-3">
            <select class="js-basic-multiple" multiple="multiple" name="genres">
                {% for genre in genres %}
                <option value="{{ genre }}">{{ genre }}</option>
                {% endfor %}
            </select>

        </div>
        
        <div class="mb-4">            
            <select class="js-basic-multiple" multiple="multiple" name="tags">
                {% for tag in tags %}
                <option value="{{ tag }}">{{ tag }}</option>
                {% endfor %}
            </select>
            <p>Recomended number: 2-3</p>       
        </div>

        <div class="mb-4">
            <select class="js-basic-multiple" multiple="multiple" name="excludeds">
                {% for tag in tags %}
                <option value="{{ tag }}">{{ tag }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label>Copies sold/owners range: </label>
            <input type="checkbox" name="copies" value="50000001 - 200000000">
            <label>50M+ |</label>
            <input type="checkbox" name="copies" value="10000000 - 50000000">
            <label>50M - 10M |</label>
            <input type="checkbox" name="copies" value="1000000 - 10000000">
            <label>10M - 1M |</label>
            <input type="checkbox" name="copies" value="500000 - 1000000">
            <label>1M - 500.000 |</label>
            <input type="checkbox" name="copies" value="500000 - 0">
            <label>500.000 - 0</label>
        
        </div>
        <input class="mb-5 btn btn-primary" type="submit" value="Submit">
    </form>
    <p>PS: Keep in mind tags are assigned to games by steam users and
        strange results are expected.
    </p>
     <link rel="stylesheet" href="static/index.css">
{% endblock %}
