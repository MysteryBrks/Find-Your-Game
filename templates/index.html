<!-- index.html should greet user with input request of tags and
 other elements to find a list of games within the steamspyapi
 data base -->

{% extends "layout.html" %}
{% block main %}
    <h1>Find Your Game</h1>
    <form action="/" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto" name="tags" placeholder="Tags" type="text">
        </div>
    </form>
{% endblock %}
